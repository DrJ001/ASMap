# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest,   r: 'oldrel-1'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install TinyTex for vignettes
        # if: runner.os == 'Windows' && runner.r == "release"
        uses: r-lib/actions/setup-tinytex@v2
        env:
          # install full prebuilt version
          TINYTEX_INSTALLER: TinyTeX

      - name: Install additional LaTeX packages
        run: |
          tlmgr install tocloft

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # Posit Package Manager is used for Linux and Windows, where it
          # provides binaries and is much faster than building from source.
          #
          # macOS is pinned to CRAN. PPM's macOS arm64 build of dotCall64
          # references the LLVM OpenMP runtime and so fails to load on a GitHub
          # runner ("symbol not found in flat namespace
          # '___kmpc_for_static_fini'"); CRAN's build of the same version does
          # not. dotCall64 is a dependency of spam and hence of fields, which
          # ASMap imports. Setting this explicitly also makes the job immune to
          # further changes in which platforms the moving v2 tag routes to PPM.
          use-public-rspm: ${{ runner.os == 'macOS' && 'false' || 'true' }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # The knitr and xfun source installs that were needed here have been
          # removed. CRAN briefly published zstd-compressed macOS .tgz binaries,
          # which pak cannot extract (r-lib/pkgdepends#485), but has since
          # rebuilt them as gzip. Verified on 2026-09-22 that none of the 45
          # packages in the recursive dependency set is zstd compressed.
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
