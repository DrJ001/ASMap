# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest,   r: 'oldrel-1'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install TinyTex for vignettes
        # if: runner.os == 'Windows' && runner.r == "release"
        uses: r-lib/actions/setup-tinytex@v2
        env:
          # install full prebuilt version
          TINYTEX_INSTALLER: TinyTeX

      - name: Install additional LaTeX packages
        run: |
          tlmgr install tocloft

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # knitr and xfun are built from source because CRAN's macOS builder
          # now zstd-compresses newly built .tgz binaries, which pak cannot
          # extract ("unknown archive type", see r-lib/pkgdepends#485). As of
          # 2026-09 these are the only two packages in our dependency tree
          # affected; both are pure R, so a source install is cheap and safe.
          # Remove these once pkgdepends supports zstd archives.
          extra-packages: |
            any::rcmdcheck
            knitr=?source
            xfun=?source
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
